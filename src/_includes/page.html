<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Celebrate design histories and write your own on Friday 18 December 2026.">
    <title>Design History Day 2026</title>
    <meta name="theme-color" content="#fdec4e">
    <link rel="icon" href="./assets/favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" sizes="any">
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
    <link rel="manifest" href="./assets/site.webmanifest">
    <link rel="canonical" href="{{ siteUrl | escape }}/">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ siteUrl | escape }}/">
    <meta property="og:title" content="Design History Day 2026">
    <meta property="og:description" content="Celebrate design histories and write your own on Friday 18 December 2026.">
    <meta property="og:image" content="{{ siteUrl | escape }}/assets/social-card.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Design History Day 2026, Friday 18 December 2026, with a toy brick on a yellow background.">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="stylesheet" href="./assets/site.css">
  </head>
  <body>
    <main>
      <header class="poster" id="top">
        <div class="poster-title">
          <h1>
            <span class="poster-title-text">Design History Day 2026</span>
            <span class="poster-lettering" aria-hidden="true">
              <img class="poster-design" src="./assets/title-design.svg" width="1365" height="293" alt="">
              <img src="./assets/title-history.svg" width="1576" height="293" alt="">
              <span class="poster-last-lines">
                <img class="poster-day" src="./assets/title-day.svg" width="700" height="282" alt="">
                <img class="poster-year" src="./assets/title-year.svg" width="885" height="301" alt="">
              </span>
            </span>
          </h1>
          <p class="poster-date"><time datetime="2026-12-18">Friday 18 December 2026</time></p>
        </div>
        <img class="poster-brick" src="./assets/brick.svg" width="584" height="546"
          alt="A two-stud toy brick with Open selected and Closed unselected.">
      </header>

      <div class="content">
        {{ content }}
      </div>
    </main>
    <footer class="site-footer">
      <p class="footer-project">
        <img src="./assets/x-govuk-crown.svg" width="24" height="24" alt="">
        <span>A <a href="https://x-govuk.org/">X-GOVUK</a> initiative</span>
      </p>
      <p class="footer-copyright">&copy; 2026, MIT licenced</p>
    </footer>
  </body>
</html>
